[theme]
base = "light"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap, serif"
primaryColor = "#A24A28"
backgroundColor = "#F1ECE3"
secondaryBackgroundColor = "#E7E0D2"
textColor = "#2A2621"
borderColor = "#DDD5C6"
baseRadius = "0.75rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#A24A28"
backgroundColor = "#F1ECE3"
secondaryBackgroundColor = "#E7E0D2"
textColor = "#2A2621"
borderColor = "#DDD5C6"

[theme.dark]
primaryColor = "#E39468"
backgroundColor = "#1B1815"
secondaryBackgroundColor = "#201C18"
textColor = "#ECE5D9"
borderColor = "#38322A"

[server]
maxUploadSize = 10
